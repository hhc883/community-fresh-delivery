# Configure real TLS certificates at the public edge before internet deployment.
# User H5 and admin use separate hosts so both Vite/uni-app root assets resolve.
server {
    listen 80;
    server_name fresh.example.com;
    root /opt/community-fresh-delivery/user;
    index index.html;
    client_max_body_size 5m;
    location ~ ^/(api|user|admin|common)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    server_name admin.fresh.example.com;
    root /opt/community-fresh-delivery/admin;
    index index.html;
    client_max_body_size 5m;
    location ~ ^/(api|user|admin|common)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
}
