# Configure real TLS certificates at the public edge before internet deployment.
# User H5 and the original Sky admin use separate hosts.
server {
    listen 80;
    server_name fresh.example.com;
    root /opt/community-fresh-delivery/user;
    index index.html;
    client_max_body_size 5m;
    location ~ ^/(api|user|admin|common)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 80;
    server_name admin.fresh.example.com;
    root /opt/community-fresh-delivery/admin;
    index index.html;
    client_max_body_size 5m;
    # Copy front-admin-sky/dist to admin/ and front-admin/dist to admin/extensions/.
    location /extensions/ { try_files $uri $uri/ /extensions/index.html; }
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location ~ ^/(api|user|admin|common)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
}
